<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Ryker — 3D Viewer</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #101216; color: #f1f5f9; font: 15px system-ui, sans-serif; }
      canvas { display: block; }
      #label { position: fixed; top: 16px; left: 16px; padding: 10px 13px; border: 1px solid #ffffff24; border-radius: 9px; background: #101216d9; pointer-events: none; }
      #label strong { display: block; font-size: 16px; }
      #label span { color: #bac3d0; font-size: 13px; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #101216; font-size: 16px; }
      #loading.error { color: #ffb4ab; }
      #options { position: fixed; right: 16px; top: 16px; width: min(310px, calc(100vw - 32px)); padding: 12px; border: 1px solid #ffffff24; border-radius: 9px; background: #101216e8; }
      #options label { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
      #options input { margin-top: 3px; accent-color: #6ee7b7; }
      #options strong { display: block; font-size: 14px; }
      #options small { display: block; margin-top: 2px; color: #bac3d0; line-height: 1.35; }
    </style>
  </head>
  <body>
    <div id="label"><strong>Ryker</strong><span>Drag to rotate · Scroll to zoom</span></div>
    <div id="options">
      <label><input id="quality-mode" type="checkbox" /><span><strong>Presentation lighting</strong><small>Enhanced reflections, soft shadows and physical-material lighting. This is a ray-traced look, not hardware ray tracing.</small></span></label>
      <label><input id="nature-mode" type="checkbox" /><span><strong>Natural materials + grass</strong><small>Replaces the original colour palette with custom playground PBR materials and animated grass. Turn it off to restore the original MTL colours.</small></span></label>
    </div>
    <div id="loading">Loading 3D model…</div>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      } }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const loading = document.querySelector('#loading');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101216);

      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 10000);
      camera.up.set(-1, 0, 0);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      document.body.append(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.5;
      controls.enablePan = true;
      controls.panSpeed = 1.1;
      controls.target.set(0, 0, 0);

      const hemisphere = new THREE.HemisphereLight(0xffffff, 0x233044, 2.5);
      scene.add(hemisphere);
      const key = new THREE.DirectionalLight(0xffffff, 2.8);
      key.position.set(100, 180, 120);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x9dc6ff, 0.55);
      fill.position.set(-100, 80, -120);
      scene.add(fill);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      let model;
      let originalMaterials = [];
      let alternateMaterials = [];
      let grassGroup;
      const qualityMode = document.querySelector('#quality-mode');
      const natureMode = document.querySelector('#nature-mode');
      const textureLoader = new THREE.TextureLoader();

      function texture(path, repeat = 4) {
        return new Promise((resolve, reject) => textureLoader.load(path, (value) => {
          value.colorSpace = path.includes('basecolor') ? THREE.SRGBColorSpace : THREE.NoColorSpace;
          value.wrapS = value.wrapT = THREE.RepeatWrapping;
          value.repeat.set(repeat, repeat);
          resolve(value);
        }, undefined, reject));
      }

      async function pbrMaterial(name, options) {
        const [map, normalMap, roughnessMap] = await Promise.all([
          texture(`./assets/materials/${name}_basecolor.png`, options.repeat),
          texture(`./assets/materials/${name}_normal.png`, options.repeat),
          texture(`./assets/materials/${name}_roughness.png`, options.repeat),
        ]);
        return new THREE.MeshPhysicalMaterial({ map, normalMap, roughnessMap, roughness: options.roughness, metalness: options.metalness, envMapIntensity: 0.8, clearcoat: options.clearcoat || 0, clearcoatRoughness: 0.35 });
      }

      async function buildAlternateMaterials() {
        if (alternateMaterials.length) return;
        const [polymer, metal, rubber, timber] = await Promise.all([
          pbrMaterial('polymer', { repeat: 3, roughness: 0.42, metalness: 0.0, clearcoat: 0.12 }),
          pbrMaterial('metal', { repeat: 5, roughness: 0.34, metalness: 0.92 }),
          pbrMaterial('rubber', { repeat: 6, roughness: 0.78, metalness: 0.0 }),
          pbrMaterial('timber', { repeat: 4, roughness: 0.5, metalness: 0.0 }),
        ]);
        const set = [polymer, metal, rubber, timber];
        alternateMaterials = originalMaterials.map((_, index) => set[index % set.length].clone());
      }

      function createGrass(bounds) {
        if (grassGroup) return;
        grassGroup = new THREE.Group();
        const groundY = bounds.min.y + 0.05;
        const bladeGeometry = new THREE.PlaneGeometry(0.55, 3.5, 1, 4);
        bladeGeometry.translate(0, 1.75, 0);
        const bladeMaterial = new THREE.MeshStandardMaterial({ color: 0x3f7d35, side: THREE.DoubleSide, roughness: 0.9 });
        texture('./assets/materials/grass_basecolor.png', 2).then((map) => { bladeMaterial.map = map; bladeMaterial.needsUpdate = true; });
        bladeMaterial.onBeforeCompile = (shader) => {
          shader.uniforms.time = { value: 0 };
          bladeMaterial.userData.shader = shader;
          shader.vertexShader = 'uniform float time;\n' + shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed.x += sin(time * 1.8 + position.y * 1.4 + instanceMatrix[3].x * 0.17 + instanceMatrix[3].z * 0.11) * position.y * 0.12;');
        };
        const blades = new THREE.InstancedMesh(bladeGeometry, bladeMaterial, 1600);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < 1600; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = 112 + Math.random() * 55;
          dummy.position.set(Math.cos(angle) * radius, groundY, Math.sin(angle) * radius);
          dummy.rotation.y = Math.random() * Math.PI;
          dummy.scale.setScalar(0.7 + Math.random() * 0.75);
          dummy.updateMatrix();
          blades.setMatrixAt(i, dummy.matrix);
        }
        blades.castShadow = blades.receiveShadow = true;
        grassGroup.add(blades);
        scene.add(grassGroup);
      }

      function applyQuality() {
        const enabled = qualityMode.checked;
        renderer.shadowMap.enabled = enabled;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMappingExposure = enabled ? 1.18 : 1;
        scene.environment = enabled ? environment : null;
        key.castShadow = enabled;
        key.shadow.mapSize.set(enabled ? 2048 : 512, enabled ? 2048 : 512);
        hemisphere.intensity = enabled ? 1.9 : 2.5;
        if (model) model.traverse((child) => { if (child.isMesh) { child.castShadow = child.receiveShadow = enabled; } });
      }

      qualityMode.addEventListener('change', applyQuality);
      natureMode.addEventListener('change', async () => {
        if (!model) return;
        natureMode.disabled = true;
        try {
          if (natureMode.checked) {
            await buildAlternateMaterials();
            model.traverse((child) => { if (child.isMesh) child.material = alternateMaterials; });
            createGrass(new THREE.Box3().setFromObject(model));
          } else {
            model.traverse((child) => { if (child.isMesh) child.material = originalMaterials; });
            if (grassGroup) grassGroup.visible = false;
          }
          if (grassGroup) grassGroup.visible = natureMode.checked;
        } finally { natureMode.disabled = false; }
      });

      new GLTFLoader().load('./ryker.glb', (gltf) => {
        model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        model.position.sub(center);
        model.traverse((child) => { if (child.isMesh) originalMaterials = Array.isArray(child.material) ? child.material.slice() : [child.material]; });
        scene.add(model);
        controls.target.set(0, 0, 0);
        const largestGroundDimension = Math.max(size.x, size.z);
        const tightFitDistance = largestGroundDimension / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
        const defaultDistance = tightFitDistance * 1.3;
        // The source model's ground is X/Z and its label faces negative Y.
        // This puts “CLIMBING AREA” upright at the bottom of the initial view.
        camera.position.set(0, -defaultDistance, 0);
        controls.minDistance = tightFitDistance * 0.22;
        controls.maxDistance = tightFitDistance * 10;
        camera.near = Math.max(defaultDistance / 1000, 0.01);
        camera.far = defaultDistance * 20;
        camera.updateProjectionMatrix();
        controls.update();
        loading.remove();
      }, undefined, (error) => {
        console.error(error);
        loading.textContent = 'The 3D model could not be loaded.';
        loading.classList.add('error');
      });

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      renderer.setAnimationLoop((time) => {
        if (grassGroup) grassGroup.traverse((child) => { if (child.material?.userData?.shader) child.material.userData.shader.uniforms.time.value = time * 0.001; });
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
